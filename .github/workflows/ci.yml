name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run eval
      - name: The committed action bundle must match the source
        run: |
          npm run build:action
          git diff --exit-code dist/action.mjs || (echo "dist/action.mjs is out of date: run npm run build:action and commit it" && exit 1)
